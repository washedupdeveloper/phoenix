name: caveman-fix
description: Diagnose a failure, patch the narrowest layer, prove it, stop.
skills:
  - investigate-first
  - surgical-patch
  - verify-and-stop
instruction: |
  Work in that order. Do not edit until one mechanism explains the evidence.
  Keep the fix at the narrowest responsible layer and leave the surrounding
  behavior untouched. Finish by running the check that proves the fix, then
  stop -- no drive-by cleanup.
