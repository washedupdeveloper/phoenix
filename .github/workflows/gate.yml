# The gate, on the one machine that can run all of it.
#
# `runs-on` names the self-hosted runner declared in
# `machines/workstation/configuration.nix` (`services.github-runners.gate`). The
# reason is the e2e tier: it needs `/dev/kvm`, GitHub-hosted runners have none, and CI
# there would skip the VM tests while reporting green over a smaller gate than the one
# a commit runs locally. A skipped tier is not a passing tier.
#
# `--all-systems` is not optional either: without it nix builds the checks of the
# *current* system only, so the Pi's `aarch64-linux` leg would never be built by CI --
# which is the one leg this job exists to prove.
#
# What this job must NOT do is run untrusted code, and the trigger set is the control
# rather than any guard written inside this file. `pull_request` is deliberately ABSENT:
# GitHub runs a `pull_request` workflow from the PR's merge commit, so a fork that edits
# this file deletes its own guard (github/docs, "Securely using pull_request_target"),
# and this repository is public -- a fork PR would therefore execute attacker-authored
# YAML and attacker-authored nix builders on this WSL guest. The two tree-side controls
# that remain (the read-only `permissions:` block, and no `--accept-flake-config`)
# constrain honest runs only. Restoring fork-safe PR CI needs the repository's
# fork-approval policy set to require approval for ALL external contributors first --
# a repository setting no file can assert.
name: gate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

# The repository default for GITHUB_TOKEN is read/write. This job only reads, and the
# token sits in the environment of a step that runs PR-authored builders.
permissions:
  contents: read

jobs:
  gate:
    runs-on: [ self-hosted, linux, kvm ]
    # A cold aarch64 leg is minutes; a dependency bump that rebuilds the closure is
    # longer. This is a backstop against a hung runner, not a build budget.
    timeout-minutes: 120
    steps:
      # Pinned to a commit, not a tag: a mutable tag is a moving target that would run
      # as the runner user on this host.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Keeps the job token out of `.git/config`, where the builders the next step
          # runs could read it from the workspace.
          persist-credentials: false

      # No `--accept-flake-config`. That flag makes nix trust the `nixConfig` of the
      # tree under test, and for a pull request that tree is untrusted: a PR could add
      # its own `extra-substituters` and `extra-trusted-public-keys` and have arbitrary
      # paths it signed land in this runner's persistent store, poisoning later builds.
      # The caches this job needs are already ambient on the machine
      # (`modules/clanServices/base-system`), and clan-core is consumed here for its
      # modules only, so `cache.clan.lol` buys nothing.
      - name: nix flake check
        run: nix flake check --all-systems --keep-going
